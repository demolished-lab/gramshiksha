name: Keep Render warm

# Render's free web service sleeps after 15 minutes without traffic. A cold
# start makes the first textbook request (and a crawler's first visit) wait
# tens of seconds, so ping the readiness endpoint from GitHub's cloud every
# 10 minutes. This is cloud scheduling, not a cron on anyone's machine, and
# stays inside Render's 750 free instance-hours per month.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-warm
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping /ready
        run: |
          curl --fail --silent --show-error \
            --retry 2 --retry-delay 5 --max-time 90 \
            https://gramshiksha-backend.onrender.com/ready
