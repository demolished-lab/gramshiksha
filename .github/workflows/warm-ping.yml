# Liveness ping + fork watch, deliberately minimal.
#
# Measured behaviour (corrects the earlier "schedule never fired" note):
# GitHub *does* run this workflow, but it throttles a `*/5` cron on a quiet
# repository to only a few runs a day (observed ~219 min apart, ~6/day). That
# is far too sparse to keep Render awake (it idles at ~15 min), so **this is
# not a keep-warm**: it is a low-frequency liveness probe whose green badge
# proves the backend answers.
#
# Real keep-warm needs a scheduler that is not subject to GitHub's cron
# throttling — an external pinger (UptimeRobot / cron-job.org) hitting
# /ready every 10 min. Until one is configured, the first visitor after an
# idle period pays a Render cold start.
#
# Public repo => Actions minutes unlimited => $0 forever.
name: warm-ping

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:          # manual kick while testing

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Ping backend (resets Render's idle timer)
        run: |
          # /ready is the cheapest 200 we serve; any HTTP hit resets
          # Render's inactivity clock, so the container never spins down.
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 90 \
            "https://gramshiksha-backend.onrender.com/ready" || echo 000)
          echo "backend -> $code"
          case "$code" in 200) ;; *) exit 1 ;; esac

      - name: Drain the book-finder queue (replaces the retired local cron)
        run: |
          # POST /library/scan-requests re-scans pending asks (library first,
          # then the official portal) and notifies finders. The endpoint has
          # its own 120 s cooldown plus a 4/min rate limit, so this 5-minute
          # tick can never turn into a crawl cannon. Exit 0 even on a
          # cooldown skip — a skip is a healthy answer, not a failure.
          body=$(curl -sS --max-time 120 -X POST \
            "https://gramshiksha-backend.onrender.com/api/library/scan-requests" || echo '{}')
          echo "scan-requests -> $body"

  # Weekly fork watch, embedded here because this file's schedule does run
  # (throttled, but it runs). forks.yml keeps its Monday cron for manual
  # dispatch only. Gate: the first Monday tick after 06:00 UTC ticks the
  # script once; the script itself is idempotent (one open issue per new
  # fork), so a late or repeated tick files nothing twice.
  fork-watch:
    # Runs on every scheduled tick, not in a narrow Monday window: GitHub
    # throttles this cron to a few unpredictable runs a day, so a
    # 06:00-06:05 gate would almost never match. The script is idempotent —
    # one issue per unreported fork, nothing on a repeat run.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: File an issue per new public fork
        run: python scripts/watch_forks.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
