# Keep-warm ping + schedule probe, deliberately minimal.
#
# Why this file exists: since repo creation (2026-09-27) keep-warm.yml's
# schedule NEVER fired — workflow_dispatch and CI runs work, only the
# 'schedule' event is dead (API: runs?event=schedule -> total_count 0 across
# 10+ missed ticks, two cron expressions, and file touches), while other
# repositories' schedules fire normally at the same minutes. This matches the
# known bug "scheduler fails to register cron jobs for brand-new
# repositories" (github.com/orgs/community/discussions/202602): the repo's
# cron daemon binding is stuck server-side and no YAML change un-sticks it
# for an existing path. A BRAND-NEW workflow path forces a fresh registration
# attempt, which is the one self-serve fix not yet tried here.
#
# If this schedule fires: this file becomes the permanent keep-warm (5 min,
# safely under Render's ~15 min idle cutoff) and keep-warm.yml keeps only
# its manual dispatch. If it never fires either: repo-level scheduler bug is
# confirmed -> GitHub Support ticket (evidence in docs/DEPLOYMENT.md).
#
# Public repo => Actions minutes unlimited => $0 forever.
name: warm-ping

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:          # manual kick while testing

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Ping backend (resets Render's idle timer)
        run: |
          # /ready is the cheapest 200 we serve; any HTTP hit resets
          # Render's inactivity clock, so the container never spins down.
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 90 \
            "https://gramshiksha-backend.onrender.com/ready" || echo 000)
          echo "backend -> $code"
          case "$code" in 200) ;; *) exit 1 ;; esac
