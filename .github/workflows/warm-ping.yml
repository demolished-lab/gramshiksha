# Keep-warm ping + schedule probe, deliberately minimal.
#
# Why this file exists: since repo creation (2026-09-27) keep-warm.yml's
# schedule NEVER fired — workflow_dispatch and CI runs work, only the
# 'schedule' event is dead (API: runs?event=schedule -> total_count 0 across
# 10+ missed ticks, two cron expressions, and file touches), while other
# repositories' schedules fire normally at the same minutes. This matches the
# known bug "scheduler fails to register cron jobs for brand-new
# repositories" (github.com/orgs/community/discussions/202602): the repo's
# cron daemon binding is stuck server-side and no YAML change un-sticks it
# for an existing path. A BRAND-NEW workflow path forces a fresh registration
# attempt, which is the one self-serve fix not yet tried here.
#
# If this schedule fires: this file becomes the permanent keep-warm (5 min,
# safely under Render's ~15 min idle cutoff) and keep-warm.yml keeps only
# its manual dispatch. If it never fires either: repo-level scheduler bug is
# confirmed -> GitHub Support ticket (evidence in docs/DEPLOYMENT.md).
#
# Public repo => Actions minutes unlimited => $0 forever.
name: warm-ping

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:          # manual kick while testing

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Ping backend (resets Render's idle timer)
        run: |
          # /ready is the cheapest 200 we serve; any HTTP hit resets
          # Render's inactivity clock, so the container never spins down.
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 90 \
            "https://gramshiksha-backend.onrender.com/ready" || echo 000)
          echo "backend -> $code"
          case "$code" in 200) ;; *) exit 1 ;; esac

      - name: Drain the book-finder queue (replaces the retired local cron)
        run: |
          # POST /library/scan-requests re-scans pending asks (library first,
          # then the official portal) and notifies finders. The endpoint has
          # its own 120 s cooldown plus a 4/min rate limit, so this 5-minute
          # tick can never turn into a crawl cannon. Exit 0 even on a
          # cooldown skip — a skip is a healthy answer, not a failure.
          body=$(curl -sS --max-time 120 -X POST \
            "https://gramshiksha-backend.onrender.com/api/library/scan-requests" || echo '{}')
          echo "scan-requests -> $body"

  # Weekly fork watch, embedded here because this file's schedule is the one
  # proven to fire (3/3 ticks). forks.yml keeps its dead Monday cron for
  # manual dispatch only. Gate: Monday 06:00-06:05 UTC ticks the script once;
  # the script itself is idempotent (one open issue per new fork), so even a
  # double tick files nothing twice.
  fork-watch:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Gate to Monday 06:00 UTC
        id: gate
        run: |
          slot=$(date -u +%u%H%M)
          if [ "$slot" -ge 10600 ] && [ "$slot" -lt 10605 ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "run=no (slot $slot)" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'yes'
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'yes'
        with:
          python-version: "3.12"
      - name: File an issue per new public fork
        if: steps.gate.outputs.run == 'yes'
        run: python scripts/watch_forks.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
