name: forks
on:
  schedule:
    # Every Monday 06:00 UTC: file one tracking issue per new public fork.
    - cron: "0 6 * * 1"
  workflow_dispatch: {} # allow a manual run from the Actions tab

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/watch_forks.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
